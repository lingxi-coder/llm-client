name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [default, tokenizers-all]
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt clippy
      - name: Test
        run: cargo test --locked --features '${{ matrix.features }}'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked --features '${{ matrix.features }}' -- -D warnings
      - name: Check Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --locked --features '${{ matrix.features }}'
      - name: Compile bilingual documentation and extension APIs downstream
        if: matrix.features == 'default'
        run: cargo test --manifest-path tests/downstream-docs/Cargo.toml --locked --offline --target-dir target
      - name: Verify default dependency isolation
        if: matrix.features == 'default'
        run: |
          cargo tree --no-default-features --edges normal --prefix none > target/default-dependencies.txt
          if grep -E '^(tokenizers|onig|tiktoken-rs|xz2) v' target/default-dependencies.txt; then exit 1; fi
      - name: Check package contents
        if: matrix.features == 'default'
        run: cargo package --list --locked
      - name: Verify standalone client package
        if: matrix.features == 'default'
        run: cargo package --locked
  tokenizer-features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: [tokenizer-openai, tokenizer-deepseek, tokenizer-qwen, tokenizer-kimi, tokenizer-glm]
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Compile individual backend
        run: cargo check --locked --no-default-features --features '${{ matrix.feature }}'
