# The same account over the other wire. Hidden: a picker offers the default
# connection, and this one is here to fail over onto.
provider_id = "xai"
base_url = "https://api.x.ai"
protocol = "anthropic_messages"
# No `model_list` override, and it is worth saying why: this host publishes its
# list in the *other* wire's shape, at the path this wire's shape would look —
# and the two shapes read an id from the same place, so the derived route lands
# on the right URL and reads the right ids anyway. Naming the other shape would
# mean naming the endpoint too, because that shape appends its path to a base
# that already carries the version segment and this route's does not.
auth = "api_key"
credential_env = "XAI_API_KEY"
billing_mode = "per_token"

display_name = "xAI Grok (Anthropic wire)"
description = "The same models and key as the sibling connection, over the Anthropic wire."
console_url = "https://console.x.ai"
api_key_url = "https://console.x.ai"
docs_url = "https://docs.x.ai"
connection = { group = "xai", connection_id = "anthropic", order = 1, hidden = true }
# catalog provenance: same derivation as the sibling connection; the models are identical, only the wire differs

[[model]]
id = "grok-4.20"
name = "Grok 4.20"
description = "Grok 4.20 is a reasoning model from SpaceXAI with industry-leading speed and agentic tool calling capabilities. It combines the lowest hallucination rate on the market with strict prompt adherance, delivering..."
release_date = "2026-03-31"
context_window = 2000000
max_output = 1800000
input_modalities = ["text", "image", "file"]
output_modalities = ["text"]
tool_call = true
reasoning = true
structured_output = true
temperature = true
attachment = true

[model.pricing]
input_per_million = 1.25
output_per_million = 2.5
