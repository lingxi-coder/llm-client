# Official endpoint reviewed 2026-10-12. Format selection keeps this account and billing product.
model_list = "none"
connection = { group = "kimi-code-responses", connection_id = "open_ai_responses", order = 0, hidden = true, protocol_profiles = { anthropic_messages = "kimi-code-anthropic", open_ai_chat = "kimi-code" } }
# A distinct membership-backed service: its keys, model ids, quotas and endpoint
# are not interchangeable with the platform it is grouped with, which is why the
# billing mode differs and the failover chain will not cross between them.

# Inference controls are endpoint contracts, separate from catalog model facts.
inference = { reasoning = "open_ai_responses", fast = "unavailable" }
features = { thinking = "supported", budget = { support = "unsupported", dynamic = "unsupported" }, effort = { support = "supported" }, fast = "unknown", sources = ["https://www.kimi.com/code/docs/en/kimi-code/models"] }
pricing_info = { currencies = [], units = ["subscription_quota"], dimensions = ["model", "service_tier", "submission", "input_tokens", "time"], sources = [] }

regions = ["china_mainland", "international"]
provider_id = "kimi"
base_url = "https://api.kimi.com/coding/v1"
protocol = "open_ai_responses"
auth = "api_key"
credential_env = "KIMI_API_KEY"
billing_mode = "subscription"

display_name = "Kimi Code"
description = "Kimi models covered by a coding subscription."
console_url = "https://www.kimi.com/code/console"
api_key_url = "https://www.kimi.com/code/console"

extra = { supports_previous_response_id = false }

[[model]]
id = "k3"
name = "Kimi K3"
description = "Multimodal Kimi model with 1M context and toggleable max-effort thinking for long-horizon agent work"
family = "kimi-k3"
release_date = "2026-07-16"
last_updated = "2026-07-16"
context_window = 1048576
max_output = 131072
input_modalities = ["text", "image", "video"]
output_modalities = ["text"]
tool_call = true
reasoning = true
structured_output = true
temperature = false
attachment = false
open_weights = true

[model.pricing]
source = "models.dev"


[model.features]
thinking = "supported"
fast = "unknown"
sources = ["https://www.kimi.com/code/docs/en/kimi-code/models"]
budget = { support = "unsupported", dynamic = "unsupported" }
modes = ["enabled", "disabled"]
effort = { support = "supported", levels = ["none", "low", "high", "max"], default = "high" }

