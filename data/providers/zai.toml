# The international endpoint. A separate env var from its sibling: they are
# separate accounts, and cross-wiring the keys silently bills the wrong one.

# Inference controls are endpoint contracts, separate from catalog model facts.
inference = { reasoning = "thinking_type", fast = "unavailable" }
features = { thinking = "supported", budget = { support = "unsupported", dynamic = "unsupported" }, effort = { support = "supported" }, fast = "unknown", sources = ["https://docs.z.ai/api-reference/llm/chat-completion"] }
pricing_info = { currencies = ["USD"], units = ["per_million_tokens"], dimensions = ["model", "service_tier", "submission", "input_tokens", "time"], sources = [] }

regions = ["international"]
provider_id = "zhipu"
base_url = "https://api.z.ai/api/paas/v4"
protocol = "open_ai_chat"
auth = "api_key"
credential_env = "ZAI_API_KEY"
billing_mode = "per_token"

display_name = "Z.AI"
description = "GLM models over an OpenAI-compatible wire."
console_url = "https://z.ai"
api_key_url = "https://z.ai/manage-apikey/apikey-list"
connection = { group = "zhipu", connection_id = "api", order = 1 }
extra = { web_search = "glm", web_search_engine = "search-prime" }

