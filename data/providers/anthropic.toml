# First-party Anthropic. Wire IDs are checked against the Claude API;
# catalog metadata and prices retain their aggregator provenance.
regions = ["international"]
provider_id = "anthropic"
base_url = "https://api.anthropic.com"
protocol = "anthropic_messages"
auth = "api_key"
credential_env = "ANTHROPIC_API_KEY"
billing_mode = "per_token"

display_name = "Anthropic"
description = "First-party Claude models over the Messages API."
console_url = "https://console.anthropic.com"
api_key_url = "https://console.anthropic.com/settings/keys"
docs_url = "https://platform.claude.com/docs"
credential_hint = "sk-ant-"
# IDs/lifecycle checked 2026-09-23:
# https://platform.claude.com/docs/en/about-claude/model-deprecations
# Prices and descriptive metadata: models.dev via aggregator.
# Old aggregator IDs are local aliases, never sent to the first-party endpoint.

extra = { web_search = "anthropic" }

[[model]]
id = "claude-fable-5"
name = "Claude Fable 5"
description = "Claude Fable 5 is a Mythos-class model from Anthropic, built for autonomous knowledge work and coding. It supports text, image, and file inputs with text output, with reasoning support and..."
release_date = "2026-06-09"
context_window = 1000000
max_output = 128000
input_modalities = ["text", "image", "file"]
output_modalities = ["text"]
tool_call = true
reasoning = true
structured_output = true
temperature = false
attachment = true

