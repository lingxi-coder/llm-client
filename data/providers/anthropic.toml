# First-party Anthropic. The source project ships no preset for it, so the
# catalog below is derived from an aggregator's view of the same models; the
# route itself is the published API.
provider_id = "anthropic"
base_url = "https://api.anthropic.com"
protocol = "anthropic_messages"
auth = "api_key"
credential_env = "ANTHROPIC_API_KEY"
billing_mode = "per_token"

display_name = "Anthropic"
description = "First-party Claude models over the Messages API."
console_url = "https://console.anthropic.com"
api_key_url = "https://console.anthropic.com/settings/keys"
docs_url = "https://platform.claude.com/docs"
credential_hint = "sk-ant-"
# catalog provenance: derived from the aggregator slice by stripping its anthropic/ qualifier; the source project ships no first-party slice, and the prices are the aggregator's

extra = { web_search = "anthropic" }

[[model]]
id = "claude-3-haiku"
name = "Claude 3 Haiku"
description = "Claude 3 Haiku is Anthropic's fastest and most compact model for\nnear-instant responsiveness. Quick and accurate targeted performance.\n\nSee the launch announcement and benchmark results [here](https://www.anthropic.com/news/claude-3-haiku)\n\n#multimodal"
release_date = "2024-03-13"
context_window = 200000
max_output = 4096
input_modalities = ["text", "image"]
output_modalities = ["text"]
tool_call = true
reasoning = false
structured_output = false
temperature = true
attachment = true

