# Official endpoint reviewed 2026-10-12. Format selection keeps this account and billing product.
model_list = "none"
connection = { group = "zai-coding-chat", connection_id = "open_ai_chat", order = 0, hidden = true, protocol_profiles = { open_ai_responses = "zai-coding-responses", anthropic_messages = "zai-coding" } }

# Inference controls are endpoint contracts, separate from catalog model facts.
inference = { reasoning = "thinking_type", fast = "unavailable", enabled_requires_budget = false }
features = { thinking = "supported", budget = { support = "unsupported", dynamic = "unsupported" }, effort = { support = "supported" }, fast = "unknown", sources = ["https://docs.z.ai/api-reference/llm/chat-completion"] }
pricing_info = { currencies = [], units = ["subscription_quota"], dimensions = ["model", "service_tier", "submission", "input_tokens", "time"], sources = [] }

regions = ["international"]
provider_id = "zhipu"
base_url = "https://api.z.ai/api/coding/paas/v4"
protocol = "open_ai_chat"
auth = "api_key"
credential_env = "ZAI_CODING_API_KEY"
billing_mode = "subscription"
display_name = "GLM Coding Plan International"
description = "GLM Coding Plan on Z.AI's international Anthropic-compatible API."
console_url = "https://z.ai"
api_key_url = "https://z.ai/manage-apikey/apikey-list"

[[model]]
id = "glm-4.7"
name = "GLM-4.7"
context_window = 204800
max_output = 131072
input_modalities = ["text"]
output_modalities = ["text"]
tool_call = true
reasoning = true

[model.features]
thinking = "supported"
fast = "unknown"
sources = ["https://docs.z.ai/api-reference/llm/chat-completion"]
budget = { support = "unsupported", dynamic = "unsupported" }
modes = ["enabled", "disabled"]
effort = { support = "unknown" }
