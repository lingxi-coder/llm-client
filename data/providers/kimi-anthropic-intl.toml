# Official endpoint reviewed 2026-10-12. Format selection keeps this account and billing product.
model_list = "none"
connection = { group = "kimi-anthropic-intl", connection_id = "anthropic_messages", order = 0, hidden = true, protocol_profiles = { open_ai_responses = "kimi-search-intl", open_ai_chat = "kimi-intl" } }

# Inference controls are endpoint contracts, separate from catalog model facts.
inference = { reasoning = "anthropic", fast = "unavailable", enabled_requires_budget = false }
features = { thinking = "supported", budget = { support = "unsupported", dynamic = "unsupported" }, effort = { support = "supported" }, fast = "unknown", sources = ["https://platform.kimi.com/docs/guide/use-reasoning-effort"] }
pricing_info = { currencies = ["USD"], units = ["per_million_tokens"], dimensions = ["model", "service_tier", "submission", "input_tokens", "time"], sources = [] }

regions = ["international"]
provider_id = "kimi"
base_url = "https://api.moonshot.ai/anthropic"
protocol = "anthropic_messages"
auth = "api_key"
credential_env = "MOONSHOT_INTL_API_KEY"
billing_mode = "per_token"
extra = { explicit_cache = "top_level_only" }
display_name = "Kimi International"
description = "Kimi models on Moonshot's international API."
console_url = "https://platform.kimi.ai"
api_key_url = "https://platform.kimi.ai/console/api-keys"

[[model]]
id = "kimi-k2.6"
application_output_tokens = 262144 # Preserved per-model application policy, not an API default.
name = "Kimi K2.6"
context_window = 262144
max_output = 262144
input_modalities = ["text", "image", "video"]
output_modalities = ["text"]
tool_call = true
reasoning = true
attachment = true

[model.features]
thinking = "supported"
fast = "unknown"
sources = ["https://platform.kimi.com/docs/guide/use-reasoning-effort"]
budget = { support = "unsupported", dynamic = "unsupported" }
modes = ["enabled", "disabled"]
[[model]]
id = "kimi-k3"
application_output_tokens = 131072 # Preserved per-model application policy, not an API default.
name = "Kimi K3"
context_window = 1048576
max_output = 131072
input_modalities = ["text", "image", "video"]
output_modalities = ["text"]
tool_call = true
reasoning = true
structured_output = true
attachment = true

[model.features]
thinking = "unknown"
fast = "unknown"
sources = ["https://platform.kimi.com/docs/guide/use-reasoning-effort"]
budget = { support = "unsupported", dynamic = "unsupported" }
effort = { support = "unknown" }
