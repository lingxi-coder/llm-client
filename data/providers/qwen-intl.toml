
# Inference controls are endpoint contracts, separate from catalog model facts.
inference = { reasoning = "enable_thinking", fast = "unavailable" }
features = { thinking = "supported", budget = { support = "supported", dynamic = "unsupported" }, effort = { support = "unknown" }, fast = "unknown", sources = ["https://www.alibabacloud.com/help/en/model-studio/deep-thinking"] }
pricing_info = { currencies = ["USD"], units = ["per_million_tokens"], dimensions = ["model", "service_tier", "submission", "input_tokens", "time"], sources = [] }

regions = ["international"]
provider_id = "qwen"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
protocol = "open_ai_chat"
auth = "bearer"
credential_env = "DASHSCOPE_INTL_API_KEY"
billing_mode = "per_token"
display_name = "Qwen Singapore"
description = "Qwen models in the Singapore region."
console_url = "https://bailian.console.aliyun.com/"
api_key_url = "https://bailian.console.aliyun.com/?tab=model#/api-key"
connection = { group = "qwen-sg", connection_id = "chat", order = 0 }
extra = { file_adapter = "qwen" }

[[model]]
id = "qwen3.8-flash"
name = "Qwen3.8 Flash"
context_window = 1048576
max_output = 131072
input_modalities = ["text", "image", "video"]
