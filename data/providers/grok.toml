# This vendor also speaks both wires behind one key, so its second entry is a
# connection rather than a provider.
provider_id = "xai"
base_url = "https://api.x.ai/v1"
protocol = "open_ai_chat"
auth = "api_key"
credential_env = "XAI_API_KEY"
billing_mode = "per_token"

display_name = "xAI Grok"
description = "First-party Grok models over an OpenAI-compatible wire."
console_url = "https://console.x.ai"
api_key_url = "https://console.x.ai"
docs_url = "https://docs.x.ai"
connection = { group = "xai", connection_id = "openai", order = 0 }
# catalog provenance: derived from the aggregator slice by stripping its x-ai/ qualifier; this vendor publishes no first-party slice, and the prices are the aggregator's

