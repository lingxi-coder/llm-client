# The open platform, pay as you go. Grouped with the membership service so the
# two are connections of one provider rather than two providers.

# Inference controls are endpoint contracts, separate from catalog model facts.
inference = { reasoning = "thinking_type", fast = "unavailable" }
features = { thinking = "supported", budget = { support = "unsupported", dynamic = "unsupported" }, effort = { support = "supported" }, fast = "unknown", sources = ["https://platform.kimi.com/docs/guide/use-reasoning-effort"] }
pricing_info = { currencies = ["USD"], units = ["per_million_tokens"], dimensions = ["model", "service_tier", "submission", "input_tokens", "time"], sources = [] }

regions = ["china_mainland"]
provider_id = "kimi"
base_url = "https://api.moonshot.cn/v1"
protocol = "open_ai_chat"
auth = "api_key"
credential_env = "MOONSHOT_API_KEY"
billing_mode = "per_token"

display_name = "Kimi"
description = "First-party Kimi models over an OpenAI-compatible wire."
console_url = "https://platform.kimi.com"
api_key_url = "https://platform.kimi.com/console/api-keys"
connection = { group = "kimi", connection_id = "open", order = 1 }

# The terminal usage object is omitted from SSE unless it is asked for, which
# would otherwise leave the transcript and every token counter at zero.
extra = { stream_usage_opt_in = true, preserve_reasoning_content = true }

[[model]]
id = "kimi-k2.6"
name = "Kimi K2.6"
description = "Multimodal Kimi workhorse for agent loops, coding tasks, and visual context"
family = "kimi-k2"
knowledge_cutoff = "2025-01"
release_date = "2026-04-21"
last_updated = "2026-04-21"
context_window = 262144
max_output = 262144
input_modalities = ["text", "image", "video"]
output_modalities = ["text"]
tool_call = true
reasoning = true
structured_output = true
temperature = true
attachment = true
open_weights = true

[model.pricing]
input_per_million = 0.95
output_per_million = 4
cache_read_per_million = 0.16
source = "models.dev"


