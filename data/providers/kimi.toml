# The open platform, pay as you go. Grouped with the membership service so the
# two are connections of one provider rather than two providers.
regions = ["china_mainland"]
provider_id = "kimi"
base_url = "https://api.moonshot.cn/v1"
protocol = "open_ai_chat"
auth = "api_key"
credential_env = "MOONSHOT_API_KEY"
billing_mode = "per_token"

display_name = "Kimi"
description = "First-party Kimi models over an OpenAI-compatible wire."
console_url = "https://platform.kimi.com"
api_key_url = "https://platform.kimi.com/console/api-keys"
connection = { group = "kimi", connection_id = "open", order = 1 }

# The terminal usage object is omitted from SSE unless it is asked for, which
# would otherwise leave the transcript and every token counter at zero.
extra = { stream_usage_opt_in = true, preserve_reasoning_content = true }

[[model]]
id = "kimi-k2-0711-preview"
name = "Kimi K2 0711"
description = "Kimi model for long-context chat, coding, and agentic reasoning"
family = "kimi-k2"
knowledge_cutoff = "2024-10"
release_date = "2025-07-14"
last_updated = "2025-07-14"
context_window = 131072
max_output = 16384
input_modalities = ["text"]
output_modalities = ["text"]
tool_call = true
reasoning = false
temperature = true
attachment = false
open_weights = true

[model.pricing]
input_per_million = 0.6
output_per_million = 2.5
cache_read_per_million = 0.15
