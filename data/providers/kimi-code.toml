# A distinct membership-backed service: its keys, model ids, quotas and endpoint
# are not interchangeable with the platform it is grouped with, which is why the
# billing mode differs and the failover chain will not cross between them.

# Inference controls are endpoint contracts, separate from catalog model facts.
inference = { reasoning = "thinking_type", fast = "unavailable" }
features = { thinking = "supported", budget = { support = "unsupported", dynamic = "unsupported" }, effort = { support = "supported" }, fast = "unknown", sources = ["https://platform.kimi.com/docs/guide/use-reasoning-effort"] }
pricing_info = { currencies = [], units = ["subscription_quota"], dimensions = ["model", "service_tier", "submission", "input_tokens", "time"], sources = [] }

regions = ["china_mainland", "international"]
provider_id = "kimi"
base_url = "https://api.kimi.com/coding/v1"
protocol = "open_ai_chat"
auth = "api_key"
credential_env = "KIMI_API_KEY"
billing_mode = "subscription"

display_name = "Kimi Code"
description = "Kimi models covered by a coding subscription."
console_url = "https://www.kimi.com/code/console"
api_key_url = "https://www.kimi.com/code/console"
connection = { group = "kimi", connection_id = "code", order = 0 }
extra = { stream_usage_opt_in = true, preserve_reasoning_content = true }

[[model]]
id = "k3"
name = "Kimi K3"
description = "Multimodal Kimi model with 1M context and toggleable max-effort thinking for long-horizon agent work"
family = "kimi-k3"
release_date = "2026-07-16"
last_updated = "2026-07-16"
context_window = 1048576
max_output = 131072
input_modalities = ["text", "image", "video"]
output_modalities = ["text"]
tool_call = true
reasoning = true
structured_output = true
temperature = false
attachment = false
open_weights = true

[model.pricing]
source = "models.dev"


[model.features]
thinking = "supported"
fast = "unknown"
sources = ["https://platform.kimi.com/docs/guide/use-reasoning-effort"]
budget = { support = "unsupported", dynamic = "unsupported" }
modes = ["enabled"]
effort = { support = "supported", levels = ["low", "high", "max"], default = "max" }

