
# Inference controls are endpoint contracts, separate from catalog model facts.
inference = { reasoning = "anthropic", fast = "priority", enabled_requires_budget = false }
features = { thinking = "supported", budget = { support = "unsupported", dynamic = "unsupported" }, effort = { support = "unknown" }, fast = "supported", sources = ["https://platform.minimax.io/docs/api-reference/text-anthropic-api"] }
pricing_info = { currencies = ["USD"], units = ["per_million_tokens"], dimensions = ["model", "service_tier", "submission", "input_tokens"], sources = ["https://platform.minimax.io/docs/guides/pricing-paygo"] }

regions = ["international"]
provider_id = "minimax"
base_url = "https://api.minimax.io/anthropic"
protocol = "anthropic_messages"
model_list = "none"
auth = "bearer"
credential_env = "MINIMAX_API_KEY"
